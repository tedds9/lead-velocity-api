<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Manifest Gateway - Demo Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0e14; color: #f4f4f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .form-card { background: #131924; border: 1px solid #1f293d; border-radius: 12px; width: 100%; max-width: 450px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .brand-header { text-align: center; margin-bottom: 28px; }
        .brand-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: #fff; margin-bottom: 6px; }
        .brand-header p { color: #7888a3; font-size: 14px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #9aa8bc; margin-bottom: 8px; }
        .input-group input, .input-group textarea { width: 100%; padding: 12px 16px; background: #0b0e14; border: 1px solid #26354a; border-radius: 6px; color: #fff; font-size: 15px; transition: border 0.2s ease; }
        .input-group input:focus, .input-group textarea:focus { outline: none; border-color: #ff8c00; }
        button { width: 100%; padding: 14px; background: #ff8c00; border: none; border-radius: 6px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s ease; margin-top: 10px; }
        button:hover { background: #e07b00; }
        .status-msg { text-align: center; margin-top: 16px; font-size: 14px; font-weight: 500; display: none; }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="brand-header">
            <!-- You will swap this name out with the target client's brand when recording your pitch -->
            <h2 id="client-title">GALLERY STREETWEAR</h2>
            <p>Wholesale & Custom Capsule Application</p>
        </div>

        <form id="leadForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Todd Daniels" required>
            </div>
            <div class="input-group">
                <label>Contact Phone Number</label>
                <input type="tel" id="phone" placeholder="+1 250 555 0192" required>
            </div>
            <div class="input-group">
                <label>Requested Allocation / Service</label>
                <textarea id="service" rows="3" placeholder="Bulk drop inventory allocation for NY storefront retail setup..." required></textarea>
            </div>
            <button type="submit" id="submitBtn">Submit Application</button>
        </form>
        
        <div id="status" class="status-msg"></div>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            
            submitBtn.textContent = 'Processing Secure Link...';
            submitBtn.disabled = true;

            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                serviceNeeded: document.getElementById('service').value
            };

            try {
                // 👇 FIRING THE DATA PACKET STRAIGHT OVER THE LIVE PUBLIC WEB TO RENDER
                const response = await fetch('https://lead-velocity-api.onrender.com/api/v1/lead-hook', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.style.color = '#2ecc71';
                    statusDiv.textContent = '⚡ SYSTEM INTERCEPT COMPLETE: ALERT INJECTED!';
                } else {
                    statusDiv.style.color = '#e74c3c';
                    statusDiv.textContent = '❌ INTERCEPT FAILURE: ' + data.error;
                }
            } catch (err) {
                statusDiv.style.color = '#e74c3c';
                statusDiv.textContent = '❌ NETWORK DISCONNECT: Failed to reach cloud API.';
            } finally {
                statusDiv.style.display = 'block';
                submitBtn.textContent = 'Submit Application';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
